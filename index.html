<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApnaDost - AI Chatbot</title>
    <style>
        /* CSS: Deshban (Design) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #343541;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #202123;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid #343541;
        }

        .new-chat-btn {
            background-color: #343541;
            color: white;
            border: 1px solid #565869;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2A2B32;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #343541;
            position: relative;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 16px;
        }

        .user-msg {
            background-color: #5436DA;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .ai-msg {
            background-color: #444654;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: #343541;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .input-container {
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background-color: #40414F;
            border: none;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 16px;
            padding-right: 50px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            outline: none;
        }

        .send-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #5436DA;
            cursor: pointer;
            font-size: 20px;
        }

        .api-warning {
            background-color: #ff4b4b;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            display: none; /* Hidden by default */
        }
        
        /* Simple Loading Animation */
        .typing {
            color: #aaa;
            font-size: 14px;
            padding: 15px;
            background-color: #444654;
            border-radius: 8px;
            align-self: flex-start;
            display: none;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>
        <div style="margin-top: auto; font-size: 12px; color: #8e8ea0;">
            ApnaDost v1.0
        </div>
    </div>

    <!-- Main Chat -->
    <div class="chat-area">
        <div id="api-warning" class="api-warning">
            ⚠️ API Key nahi mila! Niche diye gaye link se key lein.
        </div>
        
        <div class="messages" id="chat-box">
            <div class="message ai-msg">
                Namaste! Main hu ApnaDost. Aap mujhe kisi bhi language mein puuch sakte hain. 
                <br><br>
                (Note: Is code ko chalne ke liye aapko <a href="https://makersuite.google.com/app/apikey" target="_blank" style="color: #8e8ea0; text-decoration: underline;">Google AI Studio</a> se free API Key leni hogi aur niche Javascript code mein daalni hogi.)
            </div>
        </div>

        <div class="typing" id="typing-indicator">ApnaDost typing...</div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="ApnaDost se kuch bhi puuchein..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // JavaScript: Dimaag (Logic)

        // -------------------- IMPORTENT --------------------
        // Yahan apni API Key daalein jo aapne Google AI Studio se li hai.
        const API_KEY = "AIzaSy..."; // TODO: Apni API Key yahan paste karein (string ke andar)
        // ----------------------------------------------------

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const apiWarning = document.getElementById('api-warning');

        // Check if API key is empty
        if (API_KEY === "AIzaSy..." || API_KEY === "") {
            apiWarning.style.display = "block";
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function clearChat() {
            chatBox.innerHTML = '<div class="message ai-msg">Chat clear ho gaya. Firse shuru karte hain!</div>';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // 1. User ka message dikhayein
            addMessage(text, 'user-msg');
            userInput.value = "";

            // 2. Bot type kar raha hai dikhayein
            typingIndicator.style.display = "block";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. API call karein Google Gemini ko
                const response = await getGeminiResponse(text);
                
                // 4. Bot ka reply dikhayein
                typingIndicator.style.display = "none";
                addMessage(response, 'ai-msg');
            } catch (error) {
                typingIndicator.style.display = "none";
                addMessage("Error aaya hai. (Shayad API key galat hai ya internet issue hai)", 'ai-msg');
                console.error(error);
            }
        }

        function addMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function getGeminiResponse(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: prompt }]
                        }
                    ],
                    // System instruction taki yeh "ApnaDost" ki tarah behave kare
                    systemInstruction: {
                        parts: [{ text: "You are ApnaDost, a helpful and friendly AI assistant. Reply in the same language the user speaks to you." }]
                    }
                })
            });

            const result = await response.json();
            
            if (result.candidates && result.candidates.length > 0) {
                return result.candidates[0].content.parts[0].text;
            } else {
                return "Mujhe kuch samajh nahi aaya. Ya API limit reach ho gaya ho sakta hai.";
            }
        }
    </script>
</body>
</html>
